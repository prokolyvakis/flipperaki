name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cocogitto@7.0.0
      - name: Validate incoming commits and PR title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # `cog check A..B` also checks A itself, which would reject the preserved
        # GitHub "Initial commit"; verify exactly git's incoming range instead.
        run: |
          status=0
          for commit in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "$commit" | cog verify --file - || { echo "::error::$commit"; status=1; }
          done
          printf '%s\n' "$PR_TITLE" | cog verify --file - || status=1
          exit "$status"

  host:
    runs-on: macos-15 # ARM64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install protobuf
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo nextest run --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo build --release --locked

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y clang clang-tidy cmake protobuf-compiler
      - name: Generated protocol is up to date
        run: scripts/gen-protocol.sh && git diff --exit-code -- protocol/generated
      - run: scripts/check-c.sh
      - run: scripts/build-fap.sh

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - run: cargo deny check
