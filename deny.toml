# cargo-deny policy: advisories, licenses, sources, duplicates.
[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # Informational "unmaintained", no vulnerability and no fixed release. rmcp 3.11
  # requires chrono (directly and via schemars/chrono04); remove this entry once
  # rmcp drops it or moves to jiff/time.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by rmcp, no alternative" },
]

[licenses]
# Compatible with distributing the combined work under AGPL-3.0.
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
